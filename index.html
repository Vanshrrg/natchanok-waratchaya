<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>วรัชยา & ณัชชนก · 21.03.2027</title>
  <meta name="description" content="ขอเรียนเชิญร่วมเป็นเกียรติในงานมงคลสมรส วันอาทิตย์ที่ 21 มีนาคม พ.ศ. 2570 ณ โรงแรมเพชรรัชต์การ์เด้น">
  <meta name="theme-color" content="#EFE8DF">

  <meta property="og:type" content="website">
  <meta property="og:title" content="วรัชยา & ณัชชนก · Wedding Invitation">
  <meta property="og:description" content="วันอาทิตย์ที่ 21 มีนาคม พ.ศ. 2570 · โรงแรมเพชรรัชต์การ์เด้น">
  <meta property="og:image" content="https://vanshrrg.github.io/natchanok-waratchaya/assets/og.jpg">
  <meta property="og:url" content="https://vanshrrg.github.io/natchanok-waratchaya/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans+Thai:wght@300;400;500&family=Srisakdi&family=Hurricane&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme-orange.css">
  <link rel="stylesheet" href="theme-sky.css">
  <!-- Two versions: orange (default styles) and blue (.sky). Each visit picks one at random;
       ?theme=sky or ?theme=gold forces one. The toggle button switches between them. -->
  <script>
    (function () {
      var m = location.search.match(/[?&]theme=(sky|gold)\b/);
      var sky = m ? m[1] === "sky" : Math.random() < 0.5;
      if (sky) document.documentElement.classList.add("sky");
    })();
  </script>
</head>
<body class="locked">

  <!-- ===== Cover ===== -->
  <section id="cover" class="cover" aria-label="หน้าปก">
    <div class="glow glow-tr"></div>
    <div class="glow glow-bl"></div>
    <div class="slats" aria-hidden="true"></div>

    <div class="cover-inner">
      <div class="moon">
        <img class="logo" src="assets/logo.png" alt="" hidden>
        <div class="monogram" aria-hidden="true"><span data-mono="0"></span><span data-mono="1"></span></div>
      </div>
      <p class="eyebrow">The Wedding of</p>
      <h1 class="cover-names"><span data-bind="bride.th"></span> <i>&amp;</i> <span data-bind="groom.th"></span></h1>
      <p class="cover-date" data-bind="dateTextEn"></p>
      <button id="open" class="btn btn-solid btn-music">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M9 17.5V6l11-2v11.5a2.5 2.5 0 1 1-2-2.45V7.4l-7 1.27v8.83A2.5 2.5 0 1 1 9 17.5Z"/></svg>
        เปิดการ์ด
      </button>
    </div>
  </section>

  <!-- phones only: first screen shows the painting; this cue invites a scroll -->
  <a class="scroll-cue" id="scrollCue" href="#card"><span>เลื่อนลง</span><span><i></i></span></a>

  <!-- wide screens only: painting tiles behind the card (see theme-*.css) -->
  <div class="scene" aria-hidden="true"><i></i><i></i><i></i></div>

  <main class="card" id="card">

    <!-- ===== Hero ===== -->
    <section class="hero reveal">
      <div class="arch">
        <div class="arch-photo" id="heroPhoto"></div>
        <div class="glow glow-arch"></div>
        <div class="monogram monogram-sm" aria-hidden="true"><span data-mono="0"></span><span data-mono="1"></span></div>
      </div>

      <div class="parents">
        <span data-bind="parents.0.0"></span>
        <span class="parents-and">และ</span>
        <span data-bind="parents.1.0"></span>
        <span data-bind="parents.0.1"></span>
        <span data-bind="parents.1.1"></span>
      </div>

      <p class="invite" data-bind="invite"></p>

      <div class="names">
        <h2 class="name-th" data-bind="bride.full"></h2>
        <p class="name-en" data-bind="bride.en"></p>
        <span class="amp">&amp;</span>
        <p class="name-en" data-bind="groom.en"></p>
        <h2 class="name-th" data-bind="groom.full"></h2>
      </div>

      <div class="dots" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>

      <p class="date-th" data-bind="dateTextTh"></p>
      <p class="time-th" data-bind="timeTextTh"></p>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <!-- ===== Schedule ===== -->
    <section class="schedule reveal">
      <p class="label">Schedule</p>
      <h3 class="section-title">กำหนดการ</h3>
      <dl class="schedule-list" id="schedule"></dl>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <!-- ===== Venue ===== -->
    <section class="venue reveal">
      <p class="label">สถานที่</p>
      <h3 class="venue-name" data-bind="venue.name"></h3>
      <p class="venue-room" data-bind="venue.room"></p>
      <div class="actions">
        <a id="mapBtn" class="btn btn-line" target="_blank" rel="noopener">เปิดแผนที่</a>
        <button id="calBtn" class="btn btn-line" aria-expanded="false">บันทึกลงปฏิทิน</button>
      </div>
      <div id="calMenu" class="cal-menu" hidden>
        <a id="gcalLink" target="_blank" rel="noopener">Google Calendar</a>
        <span>·</span>
        <a id="icsLink" href="#">Apple / Outlook (.ics)</a>
      </div>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <!-- ===== RSVP ===== -->
    <section class="rsvp reveal" id="rsvp">
      <p class="label">RSVP</p>
      <h3 class="section-title">ตอบรับคำเชิญ</h3>

      <form id="rsvpForm" novalidate>
        <label class="field">
          <span>ชื่อ - นามสกุล</span>
          <input name="name" type="text" autocomplete="name" required>
        </label>

        <fieldset class="field choice">
          <legend>ท่านจะมาร่วมงานหรือไม่</legend>
          <label><input type="radio" name="attending" value="yes" required><span>ยินดีเข้าร่วม</span></label>
          <label><input type="radio" name="attending" value="no"><span>ไม่สะดวก</span></label>
        </fieldset>

        <label class="field" id="guestsField">
          <span>จำนวนผู้ร่วมงาน (รวมตัวท่าน)</span>
          <select name="guests"></select>
        </label>

        <label class="field">
          <span>คำอวยพร <em>(ไม่บังคับ)</em></span>
          <textarea name="message" rows="3"></textarea>
        </label>

        <p class="error" id="rsvpError" role="alert"></p>
        <button type="submit" class="btn btn-solid btn-wide">ส่งคำตอบ</button>
      </form>

      <div class="thanks" id="rsvpThanks" hidden>
        <div class="dots dots-sm" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <p class="thanks-title">ขอบคุณค่ะ / ครับ</p>
        <p id="thanksMsg"></p>
      </div>

      <div class="closed" id="rsvpClosed" hidden>ปิดรับการตอบรับแล้ว</div>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <!-- ===== Gift registry ===== -->
    <section class="gift reveal">
      <p class="label">Gift registry</p>
      <h3 class="section-title">ร่วมแสดงความยินดี</h3>
      <p class="gift-note" data-bind="gift.note"></p>
      <div class="gift-frame">
        <img class="gift-qr" src="assets/qr-gift.jpg" alt="QR code สำหรับโอนเงิน" width="180" height="180">
        <p class="gift-bank" data-bind="gift.bank"></p>
        <p class="gift-name" data-bind="gift.name"></p>
        <p class="gift-acc" data-bind="gift.account"></p>
        <p class="gift-acc" data-bind="gift.promptpay"></p>
      </div>
    </section>

    <!-- ===== Footer ===== -->
    <footer class="footer reveal">
      <div class="divider" aria-hidden="true"></div>
      <p data-bind="footer"></p>
      <img class="logo logo-footer" src="assets/logo-letters.png" alt="" hidden>
      <div class="monogram monogram-xs" aria-hidden="true"><span data-mono="0"></span><span data-mono="1"></span></div>
      <p class="footer-note">(ขออภัยหากมิได้เรียนเชิญด้วยตนเอง)</p>
    </footer>
  </main>

  <button id="themeBtn" class="theme-toggle" aria-label="เปลี่ยนสีการ์ด" title="เปลี่ยนสีการ์ด"><i></i><i></i></button>

  <button id="musicBtn" class="music" aria-label="เปิด/ปิดเพลง" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9 17.5V6l11-2v11.5a2.5 2.5 0 1 1-2-2.45V7.4l-7 1.27v8.83A2.5 2.5 0 1 1 9 17.5Z"/></svg>
  </button>
  <!-- src is set by script.js: one song per version -->
  <audio id="music" preload="metadata" loop></audio>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
