<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover names font preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Trirong:wght@300;400&family=Taviraj:wght@300;400&family=Chonburi&family=Fahkwang:wght@300;400&family=Maitree:wght@300;400&family=Srisakdi&family=Noto+Serif+Thai:wght@300;400&family=Charm&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "TH Charmonman"; src: url("../../assets/fonts/THCharmonman.ttf") format("truetype"); }
  body { margin: 0; padding: 24px 16px 48px; background: #EFE8DF; color: #3A332C; font-family: system-ui, sans-serif; }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 18px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; max-width: 1400px; margin: 0 auto; }
  .card { background: #F7F2EB; border: 1px solid #E2D7C8; border-radius: 10px; padding: 14px 16px 22px; text-align: center; }
  .tag { font: 600 13px/1 system-ui, sans-serif; color: #9C7C43; letter-spacing: .04em; margin-bottom: 14px; }
  .tag b { display: inline-block; min-width: 22px; padding: 3px 6px; margin-right: 6px; border-radius: 99px; background: #B8975A; color: #fff; }
  .tag span { font-weight: 400; color: #5C5248; }
  .names { line-height: 1.3; letter-spacing: .02em; }
  .names i { font: italic 400 28px "Cormorant Garamond", serif; color: #B8975A; padding: 0 4px; }
</style>
</head>
<body>
<h1>ฟอนต์ชื่อหน้าปก (1 = TH Charmonman ที่ใช้อยู่ตอนนี้)</h1>
<div class="grid" id="grid"></div>
<script>
  // [family, weight, size px, note]
  const fonts = [
    ["TH Charmonman", 400, 40, "current"],
    ["Trirong", 300, 34, "formal serif, high contrast"],
    ["Taviraj", 300, 34, "serif, softer"],
    ["Noto Serif Thai", 300, 32, "clean serif"],
    ["Maitree", 300, 32, "rounded serif"],
    ["Fahkwang", 300, 32, "loopless, modern-classic"],
    ["Chonburi", 400, 32, "display, bold contrast"],
    ["Srisakdi", 400, 34, "decorative traditional"],
    ["Charm", 400, 36, "brush script, lighter"],
  ];
  document.getElementById("grid").innerHTML = fonts.map(([f, w, s, note], i) => `
    <div class="card">
      <div class="tag"><b>${i + 1}</b>${f} <span>· ${note}</span></div>
      <div class="names" style="font:${w} ${s}px/1.3 '${f}'">วรัชยา <i>&amp;</i> ณัชชนก</div>
    </div>`).join("");
</script>
</body>
</html>
